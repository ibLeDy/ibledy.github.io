services:
  site:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SITE_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,uid=101,gid=101,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8080/healthz",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
