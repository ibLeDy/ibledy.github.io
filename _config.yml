# About Section
about_title: About
about_profile_image: images/profile.jpg
about_content: | # this will include new lines to allow paragraphs
  I'm a systems and platform engineer with a background in software development and experience operating large-scale production infrastructure.

  I work across Linux, Kubernetes, networking, distributed databases, infrastructure automation, and observability. My role combines systems engineering with platform and site reliability work, including designing and operating production services, improving reliability, and automating operational processes.

  My software development background influences how I approach infrastructure: systems should be reproducible, observable, maintainable, and safe to operate.
content:
  - title: Experience # Title for the section
    layout: list # Type of content section (list/text)
    content:
      - layout: left
        title: Marfeel
        sub_title: SysOps Engineer
        caption: August 2022 – Present
        description: | # this will include new lines to allow paragraphs
          Operate and improve a large-scale production platform spanning Kubernetes environments and hundreds of on-premises systems.

          - Design, deploy, and maintain production infrastructure, distributed databases, and supporting platform services.
          - Build infrastructure automation and deployment workflows using Ansible, Terraform, Helm, and Argo CD.
          - Contribute to the reliability, performance, and capacity planning of high-throughput production systems.
          - Develop monitoring, alerting, and operational tooling to improve observability and incident response.

      - layout: left
        title: Alliantum GmbH
        sub_title: System Administrator
        caption: June 2021 – June 2022
        # quote: >
        #   Worked in a developer-experience and infrastructure role, establishing engineering standards, implementing CI/CD pipelines and building internal tooling to improve maintainability and developer productivity.
        description: | # this will include new lines to allow paragraphs
          Worked across infrastructure and developer experience, introducing automation, engineering standards, and CI/CD workflows to improve deployment reliability and developer productivity.

          - Built an automated per-branch Odoo instance manager with client- and server-side tooling, providing developers with isolated application environments connected to cloned production databases and file storage.
          - Developed internal pipelines, tooling, and scripts that reduced repetitive work, improved maintainability, and enabled more frequent production deployments with fewer incidents.
          - Managed the on-premises infrastructure of the company's largest client and subsequently migrated it to Google Cloud Platform.
          - Managed infrastructure for additional clients hosted on Hetzner.
          - Maintained infrastructure security, backup and recovery processes, and production rollback procedures.
          - Migrated the company's internal services to Google Workspace.

      - layout: left
        title: Alliantum GmbH
        sub_title: Software Developer
        caption: December 2020 – June 2021
        # quote: >
        #   Maintained custom Odoo (former OpenERP) installations, and developed tailor-made addons for the client.
        description: | # this will include new lines to allow paragraphs
          Maintained customized Odoo installations and developed client-specific modules, integrations, and backend functionality.

          - Migrated Enterprise and Community installations from legacy Odoo releases to supported versions.
          - Performed production deployments, routine maintenance, and urgent hotfixes.
          - Diagnosed application and data issues across customized client environments.

  - title: Selected Projects # Title for the section
    layout: list # Type of content section (list/text)
    content:
      - title: ProviderIP
        layout: left
        link: https://providerip.com
        link_text: Visit website
        quote: >
          Identify the provider behind an IP address
        description: | # this will include new lines to allow paragraphs
          A web service that checks IPv4 and IPv6 addresses against network ranges published by supported cloud, hosting, and network providers.

          It maintains a searchable provider catalog, updates its data through scheduled ingestion, and includes automated test coverage.

      - title: Timezone Converter
        layout: left
        link: https://github.com/ibLeDy/timezone-converter
        link_text: View source
        additional_links:
          - title: View on PyPI
            icon: fab fa-python
            url: https://pypi.org/project/timezone-converter/
        quote: >
          Compare entire days across multiple time zones
        description: | # this will include new lines to allow paragraphs
          An open-source command-line tool that displays side-by-side, full-day comparisons across multiple time zones, making it easier to identify overlapping working hours and coordinate across regions.

          Available through PyPI or as a Docker container.

  - title: Technical Skills
    layout: text
    content: | # this will include new lines to allow paragraphs
      Infrastructure and orchestration: Kubernetes, Docker, Helm, Argo CD, Ansible, Terraform

      Systems and networking: Linux, TCP/IP, DNS, TLS, SSH, load balancing, reverse proxies

      Databases and distributed systems: relational databases, distributed databases, column-oriented databases, key-value stores

      Observability: Prometheus, Grafana

      Programming and automation: Python, Bash, SQL

      Cloud and hosting: AWS, OVHcloud, Hetzner

      Development and delivery: Git, GitHub, GitLab, CI/CD

